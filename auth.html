<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>מתחברים… · NoamMusic</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f2f7; color: #1c1c1e;
         font-family: -apple-system, "Segoe UI", system-ui, sans-serif; text-align: center; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f7; } }
  .spin { width: 34px; height: 34px; margin: 0 auto 14px; border-radius: 50%; border: 3px solid #8883; border-top-color: #fa2d48;
          animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  p { color: #8e8e93; }
</style>
</head>
<body>
<main>
  <div class="spin" id="spin"></div>
  <h2 id="msg">מחזירים אותך ל‑NoamMusic…</h2>
  <p id="sub"></p>
</main>
<script>
  // Google sends the sign-in result here; pass it straight back to the NoamMusic server on the home network.
  (function () {
    var q = new URLSearchParams(location.search);
    var state = q.get("state") || "";
    var back = state.split("~").slice(1).join("~");
    var ok = false;
    try {
      var u = new URL(back);
      var h = u.hostname;
      ok = /^https?:$/.test(u.protocol) && (
        h === "localhost" || h === "[::1]" || /\.local$/.test(h) ||
        /^127\./.test(h) || /^10\./.test(h) || /^192\.168\./.test(h) ||
        /^172\.(1[6-9]|2\d|3[01])\./.test(h));
    } catch (e) { ok = false; }
    if (!ok) {
      document.getElementById("spin").remove();
      document.getElementById("msg").textContent = "קישור התחברות לא תקין";
      document.getElementById("sub").textContent = "חזרו לאפליקציה ונסו להתחבר שוב.";
      return;
    }
    location.replace(back.replace(/\/$/, "") + "/api/auth/google/callback" + location.search);
  })();
</script>
</body>
</html>
